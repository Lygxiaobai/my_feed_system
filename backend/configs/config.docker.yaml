# 容器内配置。敏感项由 docker compose 从 .env 注入，缺失时启动即失败。
server:
  port: ${SERVER_PORT:-8080}

database:
  host: ${MYSQL_HOST:-mysql}
  port: ${MYSQL_PORT:-3306}
  user: ${MYSQL_USER:-root}
  password: ${MYSQL_PASSWORD}
  dbname: ${MYSQL_DATABASE:-my_feed_system}

redis:
  host: ${REDIS_HOST:-redis}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}

rabbitmq:
  host: ${RABBITMQ_HOST:-rabbitmq}
  port: ${RABBITMQ_PORT:-5672}
  username: ${RABBITMQ_USER:-admin}
  password: ${RABBITMQ_PASSWORD}
  vhost: ${RABBITMQ_VHOST:-/}
  prefetch_count: ${RABBITMQ_PREFETCH:-16}
  consumer_tag: ${RABBITMQ_CONSUMER_TAG:-feed-worker}

jwt:
  secret: ${JWT_SECRET}

upload:
  dir: ${UPLOAD_DIR:-/app/.run/uploads}
  max_video_bytes: ${MAX_VIDEO_BYTES:-268435456}

pprof:
  api:
    enabled: ${PPROF_API_ENABLED:-false}
    addr: ${PPROF_API_ADDR:-0.0.0.0:6060}
  worker:
    enabled: ${PPROF_WORKER_ENABLED:-false}
    addr: ${PPROF_WORKER_ADDR:-0.0.0.0:6061}

log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-json}
