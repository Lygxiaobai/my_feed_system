server:
  port: 8080

database:
  host: mysql
  port: 3306
  user: root
  password: ${MYSQL_PASSWORD}
  dbname: my_feed_system

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

rabbitmq:
  host: rabbitmq
  port: 5672
  username: admin
  password: ${RABBITMQ_PASSWORD}
  vhost: /
  prefetch_count: 16
  consumer_tag: feed-worker

jwt:
  secret: ${JWT_SECRET}

upload:
  dir: /app/.run/uploads
  max_video_bytes: 268435456

pprof:
  api:
    enabled: false
    addr: 0.0.0.0:6060
  worker:
    enabled: false
    addr: 0.0.0.0:6061

log:
  level: info
  format: json
