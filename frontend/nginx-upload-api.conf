add_header Access-Control-Allow-Origin $upload_cors_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Upload-Session, X-Upload-Index, X-Upload-Count" always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Max-Age 600 always;
if ($request_method = OPTIONS) { return 204; }

set $backend_host backend;
rewrite ^/api/(.*)$ /$1 break;
proxy_pass http://$backend_host:8080;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
client_body_buffer_size 8m;
client_body_timeout 300s;
# 分段边收边转，避免 nginx 先攒完整段再转 backend，上传中途被掐时 backend 完全没记录。
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
