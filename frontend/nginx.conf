server {
  listen 80;
  server_name _;

  # Allow large uploads (e.g. videos)
  client_max_body_size 300m;

  root /usr/share/nginx/html;
  index index.html;

  # Docker 内嵌 DNS。必须显式声明 resolver，下面 proxy_pass 里的变量才能在
  # 请求时动态解析域名。
  #
  # 背景：proxy_pass 写成静态域名（http://backend:8080）时，nginx 只在启动那一刻
  # 解析一次并永久缓存 IP。后端容器一旦重建就会换 IP，nginx 仍连旧地址，
  # 整个 API 会持续 502，直到前端容器也被重启——这曾经真实发生过。
  # 改成变量形式后，每次请求按 valid 周期重新解析，后端可独立重建。
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # SPA routing (Vue Router history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy to backend (strip /api prefix)
  location /api/ {
    set $backend_host backend;
    # proxy_pass 带变量时不会自动做 location 前缀替换，需显式重写掉 /api。
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8080;
    proxy_http_version 1.1;
    # Keep original Host (incl. port) so backend can generate correct absolute URLs
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 运维门禁：Grafana 静态资源会反复打这个内部子请求，不能记访问日志。
  location = /api/ops/gate {
    internal;
    set $backend_host backend;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$backend_host:8080;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $http_host;
  }

  location /grafana/ {
    auth_request /api/ops/gate;
    set $grafana_host grafana;
    proxy_pass http://$grafana_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
  }

  # Serve uploaded files via backend static route
  location /static/ {
    set $backend_host backend;
    # /static/ 前后端路径一致，无需重写，原样透传 URI。
    proxy_pass http://$backend_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
