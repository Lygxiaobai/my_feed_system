# Grafana 数据源自动装配，避免每次重建容器都要手工点一遍。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 保持一致，
      # 图表的最小步长才不会出现锯齿状空洞。
      timeInterval: 15s

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # 把日志里的 request_id 关联到同一次请求的其它日志，
      # 在 Grafana 中点一下就能跳转，等价于命令行里的 grep <requestId>。
      derivedFields:
        - name: request_id
          matcherType: label
          matcherRegex: '"request_id":"([a-f0-9]+)"'
          url: '$${__value.raw}'
          datasourceUid: loki_uid
          urlDisplayLabel: 查看该请求的全部日志
    uid: loki_uid
