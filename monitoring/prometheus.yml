# Prometheus 抓取配置。
#
# API 的 /metrics 挂在业务路由上；Worker 没有业务路由，
# 由 metrics.worker 配置单独开一个仅在 compose 网络内可达的端口。
# 关注流写扩散完全跑在 Worker 侧，不抓它就看不到扩散量。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: public-test

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: feed-api
    metrics_path: /metrics
    static_configs:
      # 走 compose 内部网络的服务名，不经过公网端口。
      - targets: ["backend:8080"]
        labels:
          service: api

  - job_name: feed-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9101"]
        labels:
          service: worker
