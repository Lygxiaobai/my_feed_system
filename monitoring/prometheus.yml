# Prometheus 抓取配置。
#
# 只抓自身与后端 API：worker 目前不暴露 HTTP 指标端点，
# 它的健康状况通过日志与队列积压观察，不在这里配置无效抓取目标。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: public-test

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: feed-api
    metrics_path: /metrics
    static_configs:
      # 走 compose 内部网络的服务名，不经过公网端口。
      - targets: ["backend:8080"]
        labels:
          service: api
